name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (lightweight — unit tests only)
        # Unit tests don't touch the vector store or torch; integration tests
        # auto-skip when the dataset isn't built, so CI stays fast.
        run: pip install langgraph langchain-core python-dotenv pytest

      - name: Run unit tests
        run: python -m pytest -q
